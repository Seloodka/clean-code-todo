<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:300,400,700" />
    <link rel="stylesheet" href="./src/css/style.css" media="screen" />

    <title>Todo App</title>
  </head>
  <body>
    <header class="page-header">
      <img src="./src/assets/eisenhower-matrix.jpg" alt="Eisenhower matrix" />
      <a class="page-header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>

    <main class="page-main">
      <section class="new-task">
        <h2 class="new-task__title">Add task</h2>
        <span class="new-task__input-wrapper">
          <input class="new-task__input" id="new-task__input" type="text" />
          <button id="new-task__add-button">Add</button>
        </span>
      </section>

      <section class="incomplete-tasks">
        <h2>Todo</h2>
        <ul id="incomplete-tasks__list">
          <li class="task">
            <input type="checkbox" />
            <label class="task__title">Pay Bills</label>
            <input class="task__input" type="text" />
            <button class="task__edit-button">Edit</button>
            <button class="task__delete-button"><img src="./src/assets/remove.svg" alt="" /></button>
          </li>

          <li class="task task--edit-mode">
            <input type="checkbox" />
            <label class="task__title">Go Shopping</label>
            <input class="task__input" type="text" value="Go Shopping" />
            <button class="task__edit-button">Save</button>
            <button class="task__delete-button"><img src="./src/assets/remove.svg" alt="" /></button>
          </li>
        </ul>
      </section>

      <section class="completed-tasks">
        <h2>Completed</h2>
        <ul id="completed-tasks__list">
          <li class="task">
            <input type="checkbox" checked />
            <label class="task__title">See the Doctor</label>
            <input class="task__input" type="text" />
            <button class="task__edit-button">Edit</button>
            <button class="task__delete-button"><img src="./src/assets/remove.svg" alt="" /></button>
          </li>
        </ul>
      </section>
    </main>
    <script src="./src/js/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:300,400,700" />
    <link rel="stylesheet" href="./src/css/style.css" media="screen" />

    <title>Todo App</title>
  </head>
  <body>
    <header class="aaa">
      <img src="./src/assets/eisenhower-matrix.jpg" alt="Eisenhower matrix" />
      <a class="more_inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>

    <main class="centered-main-page-element">
      <section>
        <h2 class="new-task">Add Item</h2>
        <span class="task-row-wrapper">
          <input class="task" id="new-task" type="text" />
          <button>Add</button>
        </span>
      </section>

      <section>
        <h2>Todo</h2>
        <ul id="incompleteTasks">
          <li>
            <input type="checkbox" />
            <label class="task">Pay Bills</label>
            <input class="task" type="text" />
            <button class="edit">Edit</button>
            <button class="delete"><img src="./src/assets/remove.svg" alt="" /></button>
          </li>
          <li class="editMode">
            <input type="checkbox" />
            <label class="task">Go Shopping</label>
            <input class="task" type="text" value="Go Shopping" />
            <button class="edit">Save</button>
            <button class="delete"><img src="./src/assets/remove.svg" alt="" /></button>
          </li>
        </ul>
      </section>

      <section>
        <h2>Completed</h2>
        <ul id="completed-tasks">
          <li>
            <input type="checkbox" checked />
            <label class="task">See the Doctor</label>
            <input class="task" type="text" />
            <button class="edit">Edit</button>
            <button class="delete"><img src="./src/assets/remove.svg" alt="" /></button>
          </li>
        </ul>
      </section>
    </main>
    <script src="./src/js/app.js"></script>
  </body>
</html>
